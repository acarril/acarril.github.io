# Workflow for building and deploying a Hugo site to GitHub Pages
name: Hugo deployment

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Validates changes before they reach the deployment branch
  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash for run steps
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0 # Pin your Hugo version for reproducible builds

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0          # Fetches all history for .GitInfo, .Lastmod, etc.
          submodules: recursive   # Checkout submodules (e.g., themes)

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true # Installs the extended version of Hugo (includes Dart Sass)

      - name: Setup Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production # Standard variable for Hugo production builds
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url || 'https://acarril.github.io' }}/"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5 # Specifically for GitHub Pages
        with:
          path: ./public # Path to the public directory Hugo builds to

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build # Ensures the build job completes before deploying
    # Permissions are inherited from the workflow level
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
