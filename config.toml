baseURL = "https://acarril.github.io"
title = "Álvaro Carril"
locale = "en-US"
enableGitInfo = true

[params]
    description = "every one and every zero"
    copyright = "Álvaro Carril — Content licensed under GNU GPL-3.0-only"
    highlight = true
    aboutExcerptSentences = 5
    google_analytics = "G-3F4R1K00EF"
    profile_image = "img/09_headshot.jpg"

    [[params.social]]
    icon_name = "github"
    url = "https://github.com/acarril"

    [[params.social]]
    icon_name = "linkedin"
    url = "https://www.linkedin.com/in/alvaro-carril/"

[menu]
    [[menu.main]]
        identifier = "cv"
        name = "CV"
        title = "CV"
        url = "/cv"
        weight = 40

    [[menu.main]]
        identifier = "about"
        name = "About"
        title = "about"
        url = "/about/"
        weight = 30

